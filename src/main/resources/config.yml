# VipRank - cấu hình
# Rank mua bằng kim cương: tăng số home và cấp thêm quyền.

prefix: '&6&lRank &8»'

# Vật phẩm dùng để mua rank
currency:
  material: DIAMOND
  name: kim cương

# Rank mặc định cho người chơi mới
default-rank: member

# true = lên rank cao hơn chỉ trả phần chênh lệch (VD đang VIP 32, mua VIP+ 96 -> trả 64)
pay-difference: true

# true = rank cao kế thừa quyền của các rank thấp hơn
inherit-permissions: true

# Thông báo cho cả server khi có người mua rank
broadcast-purchase: true

# Hiện rank trong chat
chat:
  enabled: true

# Hiện rank trong danh sách tab
tab:
  enabled: true

# Hiện tag rank trên đầu người chơi (dùng scoreboard team của scoreboard chính).
# Nếu plugin khác (scoreboard, tab) cũng dùng team cho người chơi thì tắt mục này.
nametag:
  enabled: true

# Home dùng của EssentialsX (/sethome, /home...). VipRank tự cấp quyền theo rank:
#   essentials.sethome, essentials.sethome.multiple và essentials.sethome.multiple.<tên rank>
# => Bạn cần khai báo các "set" cùng tên rank trong plugins/Essentials/config.yml, mục
#    sethome-multiple (xem file essentials-sethome-multiple.yml đi kèm), rồi /essentials reload.
# Số 'homes' bên dưới chỉ để HIỂN THỊ trong menu, phải khớp với số trong config Essentials.
essentials-homes: true

# Tích hợp LuckPerms: mỗi khi rank của người chơi đổi (mua bằng /rank buy hoặc /rank set),
# plugin chạy các lệnh dưới đây từ console để đổi nhóm LuckPerms. %group% = tên rank.
# Cần tạo sẵn các nhóm LuckPerms trùng tên rank (xem file luckperms-setup.txt đi kèm).
# Người mới vào lần đầu cũng được đặt vào nhóm của rank mặc định.
# Gõ /rank setup MỘT LẦN để plugin tự tạo toàn bộ nhóm LuckPerms và cấp quyền (không cần dán lệnh).
# Gõ /rank sync để đặt lại nhóm LuckPerms cho tất cả người đang online.
luckperms:
  enabled: true
  commands:
    - 'lp user %player% parent set %group%'

# Danh sách rank, THỨ TỰ từ thấp đến cao.
#   display:     tiền tố hiện ở chat, tab, trên đầu (hỗ trợ mã màu &)
#   icon:        vật phẩm đại diện rank trong menu /rank buy (tên Material, VD EMERALD)
#   price:       số kim cương để mua (0 = không mua được)
#   buyable:     false = không cho mua bằng /rank buy (chỉ admin /rank set)
#   homes:       số home tối đa (chỉ hiển thị, khớp với Essentials)
#   permissions: quyền cấp thêm. Rank cao tự có quyền của rank thấp (inherit-permissions).
#                Đặt dấu - trước để tước quyền, VD '-essentials.hat'. Kit essentials.kits.<rank>
#                cần bạn tạo kit cùng tên trong Essentials (/createkit vip ...).
ranks:
  member:
    display: '&7[Member]'
    icon: NAME_TAG
    price: 0
    homes: 1
    permissions: []
  vip:
    display: '&a[VIP]'
    icon: EMERALD
    price: 32
    homes: 2
    permissions:
      - essentials.hat
      - essentials.nick
      - essentials.renamehome
      - essentials.kit
      - essentials.kits.vip
  vipplus:
    display: '&b[VIP+]'
    icon: DIAMOND
    price: 64
    homes: 3
    permissions:
      - essentials.workbench
      - essentials.enderchest
      - essentials.nick.color
      - essentials.kits.vipplus
  svip:
    display: '&e[SVIP]'
    icon: GOLD_INGOT
    price: 96
    homes: 4
    permissions:
      - essentials.anvil
      - essentials.teleport.timer.move
      - essentials.kits.svip
  mvp:
    display: '&6[MVP]'
    icon: AMETHYST_SHARD
    price: 128
    homes: 5
    permissions:
      - essentials.kits.mvp
  mvpplus:
    display: '&d[MVP+]'
    icon: NETHERITE_INGOT
    price: 160
    homes: 6
    permissions:
      - essentials.nick.changecolors
      - essentials.kits.mvpplus
  elite:
    display: '&5[ELITE]'
    icon: NETHER_STAR
    price: 192
    homes: 7
    permissions:
      - essentials.kits.elite
  legend:
    display: '&c[LEGEND]'
    icon: DRAGON_EGG
    price: 224
    homes: 8
    permissions:
      - essentials.teleport.timer.bypass
      - essentials.kits.legend
  admin:
    display: '&4[Admin]'
    icon: BEACON
    price: 0
    buyable: false
    homes: 9
    permissions: []

# Menu /rank buy
#  - Mỗi rank là một ô, hiện giá, số home và thanh tiến độ kim cương.
#  - Ô kim cương ở dưới cùng là "ví": nạp kim cương vào để tích dần, đủ thì bấm rank để mua.
#    Khi mua, plugin trừ kim cương trong ví trước, thiếu mới lấy thêm trong túi đồ.
gui:
  title: '&8Menu Rank'
  rank-lore:
    - ''
    - '&7Giá: &f%price% %currency%'
    - '&7Cần trả: &f%cost% %currency%'
    - '&7Số home: &f%homes%'
    - '&7Tiến độ: %bar% &f%have%&7/&f%cost%'
    - ''
    - '%status%'
  status-owned: '&a✔ Bạn đã có rank này hoặc cao hơn'
  status-buy: '&e▶ Bấm để mua'
  status-need: '&cCòn thiếu &f%missing% &ckim cương &7(nạp vào ví bên dưới)'
  status-unbuyable: '&cRank này không bán'
  balance-name: '&b&lVí kim cương: &f%balance%'
  balance-lore:
    - '&7Trong túi đồ: &f%inv% %currency%'
    - ''
    - '&eChuột trái: &7nạp tất cả kim cương trong túi'
    - '&eChuột phải: &7nạp 1 stack (64)'
    - '&eShift + chuột phải: &7rút toàn bộ về túi'

