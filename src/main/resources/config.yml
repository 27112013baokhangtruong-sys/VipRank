  unknown-rank: '%prefix% &cKhông có rank &f%rank%&c. Gõ &f/rank list &cđể xem danh sách.'
  player-not-found: '%prefix% &cKhông tìm thấy người chơi &f%player%&c (phải từng vào server).'
  already-have: '%prefix% &cBạn đã có rank %rank% &choặc cao hơn rồi.'
  not-buyable: '%prefix% &cRank %rank% &ckhông bán, chỉ admin mới đặt được.'
  not-enough: '%prefix% &cBạn cần &f%need% %currency% &ctrong túi đồ, hiện chỉ có &f%have%&c.'
  bought: '%prefix% &aĐã mua rank %rank% &avới &f%cost% %currency%&a. Bạn có tối đa &f%homes% &ahome!'
  broadcast: '%prefix% &f%player% &7vừa mua rank %rank%&7!'
  rank-set: '%prefix% &aĐã đặt rank của &f%player% &athành %rank%&a.'
  no-luckperms: '%prefix% &cServer không có LuckPerms.'
  setup-start: '%prefix% &7Đang tạo nhóm LuckPerms (&f%count% &7lệnh), vui lòng đợi vài chục giây...'
  setup-done: '%prefix% &aĐã tạo xong nhóm LuckPerms và đặt nhóm cho người đang online.'
  synced: '%prefix% &aĐã đặt lại nhóm LuckPerms cho người chơi đang online.'
  reloaded: '%prefix% &aĐã tải lại cấu hình VipRank!'
  info: '%prefix% &f%player% &7đang có rank %rank% &7(tối đa &f%homes% &7home).'
  list-header: '%prefix% &7Danh sách rank:'
