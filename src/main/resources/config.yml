  usage-rank: '%prefix% &7Cú pháp: &c/rank list &8| &c/rank buy [rank] &8| &c/rank info &8| &c/rank set <tên> <rank> &8| &c/rank setup &8| &c/rank sync &8| &c/rank reload'
  usage-buy: '%prefix% &7Cú pháp: &c/rank buy <rank>'
